<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Jeu de Cartes en Ligne - P2P</title>
    <!-- Inclusion de PeerJS pour la connexion en ligne -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            background-color: #0b0b0f;
            color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-bottom: 5px; color: #d4af37; font-size: 1.6em; text-shadow: 0 0 10px rgba(212,175,55,0.4); }
        .net-menu {
            background: #15151c;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #d4af37;
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 0.9em;
        }
        .game-info {
            background: #15151c;
            padding: 8px 20px;
            border-radius: 8px;
            border: 1px solid #333;
            margin-bottom: 15px;
            display: flex;
            gap: 25px;
            font-size: 0.9em;
        }
        .board {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 950px;
        }
        .player-zone {
            background: #121218;
            border: 2px dashed #333;
            padding: 12px;
            border-radius: 10px;
            min-height: 200px;
            position: relative;
        }
        .player-zone h3 { margin: 0 0 8px 0; color: #888; font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px;}
        .hand {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 5px 0;
            min-height: 190px;
        }
        .card {
            background: linear-gradient(135deg, #23232e 0%, #0e0e13 100%);
            border: 2px solid #d4af37;
            border-radius: 10px;
            width: 140px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.7);
            transition: all 0.3s;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        .card:hover {
            transform: translateY(-8px) scale(1.03);
            border-color: #ffe875;
        }
        .card-img-container {
            width: 100%;
            height: 110px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #444;
            background: #000;
        }
        .card-img-container img { width: 100%; height: 100%; object-fit: cover; }
        .card-title {
            font-weight: bold;
            font-size: 0.75em;
            color: #d4af37;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 4px;
        }
        .card-stats {
            font-size: 0.7em;
            margin: 3px 0;
            background: rgba(0,0,0,0.5);
            padding: 2px;
            border-radius: 4px;
            text-align: center;
            color: #76ff03;
            font-family: monospace;
        }
        .controls { margin-top: 15px; display: flex; gap: 10px; }
        button, input {
            background: linear-gradient(135deg, #d4af37, #aa820a);
            color: #0b0b0f;
            border: none;
            padding: 8px 15px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
        }
        input { background: #222; color: #fff; border: 1px solid #444; }
        .log {
            margin-top: 15px;
            background: #111116;
            border: 1px solid #222;
            padding: 10px;
            width: 100%;
            max-width: 950px;
            border-radius: 6px;
            font-size: 0.8em;
            height: 55px;
            overflow-y: auto;
            color: #aaa;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <h1>DUEL DE CARTES — EN LIGNE</h1>

    <div class="net-menu">
        <div>Mon ID : <span id="my-id" style="color: #76ff03; font-weight: bold;">Génération...</span></div>
        <div>
            <input type="text" id="peer-id-input" placeholder="ID de l'adversaire">
            <button onclick="connectToPeer()">Rejoindre</button>
        </div>
        <div>Rôle : <span id="my-role" style="color: #d4af37; font-weight: bold;">En attente</span></div>
    </div>

    <div class="game-info">
        <div>Tour de : <span id="current-player" style="color: #d4af37; font-weight: bold;">Joueur 1</span></div>
        <div>Énergie J1 : <span id="energy-p1">3</span>/10</div>
        <div>Énergie J2 : <span id="energy-p2">3</span>/10</div>
    </div>

    <div class="board">
        <div class="player-zone">
            <h3>Terrain - Joueur 2</h3>
            <div id="field-p2" class="hand"></div>
            <h3>Main - Joueur 2 <span id="count-p2" style="font-size: 0.8em; color: #555;"></span></h3>
            <div id="hand-p2" class="hand"></div>
        </div>
        <div class="player-zone">
            <h3>Terrain - Joueur 1</h3>
            <div id="field-p1" class="hand"></div>
            <h3>Main - Joueur 1</h3>
            <div id="hand-p1" class="hand"></div>
        </div>
    </div>

    <div class="controls">
        <button onclick="endTurn()">Fin du Tour</button>
    </div>

    <div id="log" class="log">> En attente de connexion réseau...</div>

    <script>
        const baseCards = [
            { name: "Romolo", atk: 800, def: 1000, cost: 2, image: "cartes/33590.png" },
            { name: "Balayeur de Femmes", atk: 2000, def: 2000, cost: 4, image: "cartes/33592.png" },
            { name: "Balayeur Ultime", atk: 4000, def: 3000, cost: 6, image: "cartes/33597.png" },
            { name: "Pablo Rubiolo", atk: 5000, def: 5000, cost: 7, image: "cartes/33588.png" },
            { name: "Aura Pablet", atk: 3500, def: 9999, cost: 8, image: "cartes/33589.png" },
            { name: "Homme Castagnet", atk: 2000, def: 500, cost: 3, image: "cartes/33586.png" }
        ];

        let state = {
            turn: 1,
            energy: { 1: 3, 2: 3 },
            maxEnergy: { 1: 3, 2: 3 },
            hand: { 1: JSON.parse(JSON.stringify(baseCards)), 2: JSON.parse(JSON.stringify(baseCards)) },
            field: { 1: [], 2: [] }
        };

        let peer = null;
        let conn = null;
        let myPlayerNum = null;

        // Initialisation PeerJS
        peer = new Peer();
        peer.on('open', (id) => {
            document.getElementById('my-id').innerText = id;
        });

        peer.on('connection', (connection) => {
            conn = connection;
            myPlayerNum = 1; // Celui qui héberge est le Joueur 1
            document.getElementById('my-role').innerText = "Joueur 1 (Hôte)";
            logMessage("Adversaire connecté ! Tu es le Joueur 1.");
            setupConnection();
        });

        function connectToPeer() {
            const destId = document.getElementById('peer-id-input').value;
            conn = peer.connect(destId);
            myPlayerNum = 2; // Celui qui rejoint est le Joueur 2
            document.getElementById('my-role').innerText = "Joueur 2 (Invité)";
            logMessage("Connexion à l'hôte établie ! Tu es le Joueur 2.");
            setupConnection();
        }

        function setupConnection() {
            conn.on('data', (incomingState) => {
                state = incomingState;
                render();
                logMessage("Action reçue de l'adversaire.");
            });
        }

        function sendState() {
            if (conn && conn.open) {
                conn.send(state);
            }
        }

        function logMessage(msg) {
            const logEl = document.getElementById('log');
            logEl.innerHTML += `<div>> ${msg}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        function render() {
            document.getElementById('current-player').innerText = `Joueur ${state.turn}`;
            document.getElementById('energy-p1').innerText = state.energy[1];
            document.getElementById('energy-p2').innerText = state.energy[2];

            renderHand(1);
            renderField(1);
            renderHand(2, true);
            renderField(2);
        }

        function renderHand(player, hidden = false) {
            const handEl = document.getElementById(`hand-p${player}`);
            handEl.innerHTML = '';
            state.hand[player].forEach((card, index) => {
                const div = document.createElement('div');
                div.className = 'card';
                if (hidden && myPlayerNum !== player) {
                    div.innerHTML = `<div class="card-title" style="text-align:center; margin-top:70px; color:#555;">SECRET</div>`;
                } else {
                    div.innerHTML = `
                        <div class="card-img-container"><img src="${card.image}" alt="${card.name}"></div>
                        <div class="card-title">${card.name}</div>
                        <div class="card-stats">⚡ ${card.cost} | ⚔️ ${card.atk}</div>
                    `;
                    div.onclick = () => playCard(player, index);
                }
                handEl.appendChild(div);
            });
            if(hidden && myPlayerNum !== player) {
                document.getElementById('count-p2').innerText = `(${state.hand[2].length} en main)`;
            }
        }

        function renderField(player) {
            const fieldEl = document.getElementById(`field-p${player}`);
            fieldEl.innerHTML = '';
            state.field[player].forEach((card, index) => {
                const div = document.createElement('div');
                div.className = 'card';
                div.style.borderColor = '#4a90e2';
                div.innerHTML = `
                    <div class="card-img-container"><img src="${card.image}" alt="${card.name}"></div>
                    <div class="card-title">${card.name}</div>
                    <div class="card-stats">⚔️ ${card.atk} | 🛡️ ${card.def}</div>
                `;
                if(player !== state.turn && state.field[state.turn].length > 0) {
                    div.style.cursor = 'pointer';
                    div.title = "Cliquer pour attaquer";
                    div.onclick = () => resolveCombat(index);
                }
                fieldEl.appendChild(div);
            });
        }

        function playCard(player, index) {
            if (myPlayerNum && player !== myPlayerNum) {
                logMessage("Tu ne peux pas jouer les cartes de l'adversaire !");
                return;
            }
            if (player !== state.turn) {
                logMessage("Ce n'est pas ton tour !");
                return;
            }
            const card = state.hand[player][index];
            if (state.energy[player] < card.cost) {
                logMessage(`Énergie insuffisante ! (Requis: ${card.cost})`);
                return;
            }

            state.energy[player] -= card.cost;
            state.hand[player].splice(index, 1);
            state.field[player].push(card);
            logMessage(`Joueur ${player} déploie ${card.name} !`);
            
            sendState();
            render();
        }

        function resolveCombat(targetIndexP2) {
            if (state.turn !== myPlayerNum) return;
            const activePlayer = state.turn;
            const defendingPlayer = activePlayer === 1 ? 2 : 1;
            const attacker = state.field[activePlayer][0];
            const defender = state.field[defendingPlayer][targetIndexP2];

            logMessage(`Affrontement : ${attacker.name} attaque ${defender.name} !`);

            if (attacker.atk >= defender.def) {
                state.field[defendingPlayer].splice(targetIndexP2, 1);
                logMessage(`Impact critique ! ${defender.name} est détruite.`);
            } else {
                logMessage(`La défense de ${defender.name} encaisse le choc.`);
            }
            sendState();
            render();
        }

        function endTurn() {
            if (state.turn !== myPlayerNum) {
                logMessage("Ce n'est pas à ton tour de finir le tour !");
                return;
            }
            state.turn = state.turn === 1 ? 2 : 1;
            state.maxEnergy[state.turn] = Math.min(state.maxEnergy[state.turn] + 1, 10);
            state.energy[state.turn] = state.maxEnergy[state.turn];
            logMessage(`--- Début du Tour du Joueur ${state.turn} ---`);
            
            sendState();
            render();
        }

        render();
    </script>
</body>
</html>
